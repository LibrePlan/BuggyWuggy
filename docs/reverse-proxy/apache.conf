# BuggyWuggy behind Apache httpd 2.4: HTTPS for bugs.example.org, forwarded to BuggyWuggy on
# port 8080.
#
# Use (Debian/Ubuntu): copy to /etc/apache2/sites-available/buggywuggy.conf, replace
# bugs.example.org, the certificate paths and the port, then:
#   sudo a2enmod ssl proxy proxy_http headers rewrite
#   sudo a2ensite buggywuggy
#   sudo apachectl configtest && sudo systemctl reload apache2
# (RHEL/Fedora: /etc/httpd/conf.d/buggywuggy.conf; the modules are enabled there by default,
# mod_ssl is the package mod_ssl.)
#
# In /etc/buggywuggy/buggywuggy.env set:
#   BUGGYWUGGY_BASE_URL=https://bugs.example.org
#   BUGGYWUGGY_SECURE_COOKIES=true
#   SERVER_FORWARD_HEADERS_STRATEGY=framework
# and let BuggyWuggy listen only on localhost or an internal network, so that it can only be
# reached through this proxy (it trusts the X-Forwarded-* headers set below).
#
# BuggyWuggy must be served at the root of a host name; a sub-path (/bugs/) is not supported.

<VirtualHost *:80>
    ServerName bugs.example.org

    # Let's Encrypt (certbot --webroot) needs this; everything else goes to HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://bugs.example.org/$1
</VirtualHost>

<VirtualHost *:443>
    ServerName bugs.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/bugs.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bugs.example.org/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    # Browsers only use HTTPS for this host from now on. Enable once HTTPS works.
    # Header always set Strict-Transport-Security "max-age=31536000"

    # Refuse uploads larger than BUGGYWUGGY_MAX_UPLOAD_SIZE (default 200MB = 209715200 bytes)
    # here, with 413. (LimitRequestBody does not stop a proxied upload in time: BuggyWuggy
    # would refuse it and close the connection, and Apache would answer 502.)
    RewriteEngine On
    RewriteCond expr "%{HTTP:Content-Length} -gt 209715200"
    RewriteRule ^ - [R=413]

    ProxyRequests     Off
    ProxyPreserveHost On
    # Large attachments and exports may take a while.
    ProxyTimeout      300

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # mod_proxy sets X-Forwarded-For and X-Forwarded-Host itself; add the scheme and port.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
</VirtualHost>
