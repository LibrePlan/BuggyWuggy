# BuggyWuggy behind nginx: HTTPS for bugs.example.org, forwarded to BuggyWuggy on port 8080.
#
# Use: copy to /etc/nginx/sites-available/buggywuggy (Debian/Ubuntu; elsewhere
# /etc/nginx/conf.d/buggywuggy.conf), replace bugs.example.org, the certificate paths and the
# port, then:
#   sudo ln -s /etc/nginx/sites-available/buggywuggy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# In /etc/buggywuggy/buggywuggy.env set:
#   BUGGYWUGGY_BASE_URL=https://bugs.example.org
#   BUGGYWUGGY_SECURE_COOKIES=true
#   SERVER_FORWARD_HEADERS_STRATEGY=framework
# and let BuggyWuggy listen only on localhost or an internal network, so that it can only be
# reached through this proxy (it trusts the X-Forwarded-* headers set below).
#
# BuggyWuggy must be served at the root of a host name; a sub-path (/bugs/) is not supported.

server {
    listen 80;
    listen [::]:80;
    server_name bugs.example.org;

    # Let's Encrypt (certbot --webroot) needs this; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bugs.example.org;

    ssl_certificate     /etc/letsencrypt/live/bugs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bugs.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Browsers only use HTTPS for this host from now on. Enable once HTTPS works.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # At least BUGGYWUGGY_MAX_UPLOAD_SIZE (default 200MB), or larger uploads are refused here.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Uploads go straight to BuggyWuggy instead of being buffered on disk first.
        proxy_request_buffering off;
        # Large attachments and exports may take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
