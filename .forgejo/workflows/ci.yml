#
# Continuous integration for Forgejo Actions: builds the server and the web UI, runs all
# tests, checks that the generated API types are up to date, and keeps the jar as an
# artifact. Needs a Forgejo runner with the label "docker" whose jobs can use Docker: the
# tests start their PostgreSQL with Testcontainers, as on a developer machine.
#
# After a successful build of a push to main, the job "deploy-test" installs the jar on a
# test server over SSH, when the repository variable DEPLOY_HOST is set. See "Automatic
# deployment to a test server" in docs/installation.md for the variables, secrets and the
# preparation of the server.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up Java 25
        uses: https://data.forgejo.org/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache Node.js and npm packages
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            web/node
            ~/.npm
          key: web-${{ hashFiles('web/pom.xml', 'web/package-lock.json') }}
          restore-keys: web-

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Check that the API types are up to date
        shell: bash
        env:
          DB_CONTAINER: buggywuggy-ci-${{ github.run_id }}-${{ github.run_attempt }}
          BUGGYWUGGY_DB_USER: buggywuggy
          BUGGYWUGGY_DB_PASSWORD: buggywuggy
          BUGGYWUGGY_PORT: "18080"
          BUGGYWUGGY_DATA_DIR: ${{ runner.temp }}/buggywuggy-data
          BUGGYWUGGY_CONFIG_GENERATE: "false"
          BUGGYWUGGY_API_URL: http://localhost:18080
        run: |
          # A throwaway database for the server, on a free port of localhost only.
          docker run -d --rm --name "$DB_CONTAINER" -p 127.0.0.1::5432 \
            -e POSTGRES_DB=buggywuggy -e POSTGRES_USER="$BUGGYWUGGY_DB_USER" \
            -e POSTGRES_PASSWORD="$BUGGYWUGGY_DB_PASSWORD" postgres:16-alpine > /dev/null
          server=""
          trap '[ -n "$server" ] && kill $server 2> /dev/null; docker rm -f "$DB_CONTAINER" > /dev/null' EXIT
          # Over TCP: at its first start the image runs a temporary server for the initialisation,
          # reachable only through the Unix socket, and restarts after it.
          for i in $(seq 1 30); do
            docker exec "$DB_CONTAINER" pg_isready -q -h 127.0.0.1 -U "$BUGGYWUGGY_DB_USER" -d buggywuggy && break
            if [ "$i" = 30 ]; then
              docker logs "$DB_CONTAINER"
              echo "PostgreSQL did not start" >&2
              exit 1
            fi
            sleep 2
          done
          db_port=$(docker port "$DB_CONTAINER" 5432/tcp | head -n 1 | sed 's/.*://')
          export BUGGYWUGGY_DB_URL="jdbc:postgresql://127.0.0.1:$db_port/buggywuggy"

          java -jar server/target/buggywuggy.jar > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "$BUGGYWUGGY_API_URL/api/openapi" && break
            if ! kill -0 $server 2>/dev/null || [ "$i" = 60 ]; then
              cat "$RUNNER_TEMP/server.log"
              echo "The server did not start" >&2
              exit 1
            fi
            sleep 2
          done
          cd web
          # The Node.js and npm that the Maven build installed; the runner need not have them.
          export PATH="$PWD/node:$PATH"
          npm run -s api:types
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is out of date: run 'npm run api:types' against the server and commit it." >&2
            exit 1
          fi

      - name: Keep the jar
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: buggywuggy-jar
          path: server/target/buggywuggy.jar
          retention-days: 14

      - name: Keep the test reports when tests failed
        if: failure()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/target/surefire-reports/
            server/target/failsafe-reports/
          retention-days: 14

  deploy-test:
    name: Deploy to the test server
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: docker
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
    steps:
      - name: Fetch the jar of the build
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: buggywuggy-jar

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Set the secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see docs/installation.md)." >&2
            exit 1
          fi
          if ! command -v ssh > /dev/null; then
            echo "::error::The runner needs the OpenSSH client (ssh and scp)." >&2
            exit 1
          fi
          # In the job's temporary directory, not in ~/.ssh: the job may run on the runner
          # host itself, whose own SSH files must stay as they are.
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$ssh_dir"
          (umask 077 && printf '%s\n' "$SSH_KEY" > "$ssh_dir/deploy_key")
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"

      - name: Install the jar and restart BuggyWuggy
        shell: bash
        run: |
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          # -F none: no ~/.ssh/config of the runner user; only this key and these host keys.
          ssh_options=(-F none -i "$ssh_dir/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")
          scp "${ssh_options[@]}" buggywuggy.jar "$DEPLOY_USER@$DEPLOY_HOST:buggywuggy.jar"
          # Installs it, restarts the service and waits until it is healthy; rolls back otherwise.
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" sudo /usr/local/sbin/buggywuggy-deploy

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
