# BuggyWuggy — open source, self-hosted issue tracker
# Copyright (C) 2026 The BuggyWuggy contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# GitHub Actions: publishes a release on GitHub for every pushed version tag (v1.2.3). It builds
# BuggyWuggy, runs all tests, checks that the version in the jar matches the tag and that it is
# not a demo build, and attaches the jar (buggywuggy-1.2.3.jar), its SHA-256 checksum and the
# SBOMs to the release of that tag.
#
# Only in the main repository LibrePlan/BuggyWuggy: in a fork, or any other copy, the job is
# skipped. The CI of the project itself runs on Forgejo (.forgejo/workflows/ci.yml); this
# workflow does nothing else.
#
# Making a release: push the version tag to GitHub, e.g. git push <github remote> v1.2.3.
# Running it again for the same tag (Re-run jobs) replaces the files of that release.

name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'LibrePlan/BuggyWuggy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        shell: bash
        run: |
          if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not a version tag vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The full history: the build reads the commit (git.properties) of the tag.
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache Node.js and npm packages
        uses: actions/cache@v4
        with:
          path: |
            web/node
            ~/.npm
          key: web-${{ hashFiles('web/pom.xml', 'web/package-lock.json') }}
          restore-keys: web-

      - name: Build and test
        env:
          # The single sign-on tests use a small built-in OpenID Connect provider here instead
          # of Keycloak in a container (the default on developer machines).
          BUGGYWUGGY_TEST_OIDC: mock
        run: ./mvnw -B -ntp verify

      - name: Check the jar
        shell: bash
        run: |
          jar=server/target/buggywuggy.jar
          if [ ! -f "$jar" ]; then
            echo "::error::$jar was not built" >&2
            exit 1
          fi
          info=$(unzip -p "$jar" META-INF/build-info.properties)
          printf '%s\n' "$info"
          if ! grep -qx "build.version=$VERSION" <<< "$info"; then
            echo "::error::the jar has version $(sed -n 's/^build.version=//p' <<< "$info"), the tag $TAG" >&2
            exit 1
          fi
          if grep -qx 'build.demo=true' <<< "$info"; then
            echo "::error::$jar is a demo build (build.demo=true)" >&2
            exit 1
          fi

      - name: Collect the release files
        shell: bash
        run: |
          mkdir release
          cp server/target/buggywuggy.jar "release/buggywuggy-$VERSION.jar"
          cp server/target/classes/META-INF/sbom/application.cdx.json "release/buggywuggy-$VERSION-server.cdx.json"
          cp web/target/classes/META-INF/sbom/web.cdx.json "release/buggywuggy-$VERSION-web.cdx.json"
          (cd release && sha256sum "buggywuggy-$VERSION.jar" > "buggywuggy-$VERSION.jar.sha256")
          ls -l release

      # --verify-tag: never let GitHub create a missing tag on another commit.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "BuggyWuggy $VERSION" --generate-notes
          fi
