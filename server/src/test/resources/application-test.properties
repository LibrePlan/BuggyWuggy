buggywuggy.test.testcontainers=${BUGGYWUGGY_TEST_TESTCONTAINERS:true}
buggywuggy.setup.token=test-setup-token
buggywuggy.data-dir=target/test-data
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=3MB
buggywuggy.scheduling.enabled=false
buggywuggy.base-url=http://bugs.test
buggywuggy.mail.host=localhost
buggywuggy.mail.port=3025
buggywuggy.mail.security=none
buggywuggy.mail.from=BuggyWuggy <bugs@example.org>
buggywuggy.mail.timeout=5s
