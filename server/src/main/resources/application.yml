spring:
  application:
    name: buggywuggy
  datasource:
    url: ${BUGGYWUGGY_DB_URL:jdbc:postgresql://localhost:5432/buggywuggy}
    username: ${BUGGYWUGGY_DB_USER:buggywuggy}
    password: ${BUGGYWUGGY_DB_PASSWORD:buggywuggy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${BUGGYWUGGY_MAX_ATTACHMENT_SIZE:50MB}
      max-request-size: ${BUGGYWUGGY_MAX_UPLOAD_SIZE:200MB}
  session:
    jdbc:
      initialize-schema: never  # tables are created by Flyway (V10)

server:
  port: ${BUGGYWUGGY_PORT:8080}
  servlet:
    session:
      timeout: ${BUGGYWUGGY_SESSION_TIMEOUT:8h}
      cookie:
        name: BUGGYWUGGY_SESSION
        http-only: true
        same-site: lax
        secure: ${BUGGYWUGGY_SECURE_COOKIES:false}  # set to true when served over HTTPS

buggywuggy:
  # Where BuggyWuggy keeps files (attachments). Back it up together with the database.
  data-dir: ${BUGGYWUGGY_DATA_DIR:data}
  # The address users open BuggyWuggy at; used for links in e-mails.
  base-url: ${BUGGYWUGGY_BASE_URL:http://localhost:8080}
  # E-mail notifications. Without a host, no mail is sent.
  mail:
    host: ${BUGGYWUGGY_MAIL_HOST:}
    port: ${BUGGYWUGGY_MAIL_PORT:587}
    username: ${BUGGYWUGGY_MAIL_USERNAME:}
    password: ${BUGGYWUGGY_MAIL_PASSWORD:}
    security: ${BUGGYWUGGY_MAIL_SECURITY:starttls}  # starttls, ssl or none
    from: ${BUGGYWUGGY_MAIL_FROM:BuggyWuggy <buggywuggy@localhost>}
    # Changes by one person to one issue are bundled into one mail once nothing happened for
    # quiet-period, but are never held back longer than max-delay.
    quiet-period: 60s
    max-delay: 5m
    max-attempts: 8
    retention: 30d
  donation:
    comic:
      # The login page's donation text shows xkcd 2347 "Dependency". BuggyWuggy downloads it once
      # from imgs.xkcd.com into data-dir/cache/xkcd and serves it itself; false: never download
      # it (the page then shows only its attribution).
      download: ${BUGGYWUGGY_DONATION_COMIC_DOWNLOAD:true}
  setup:
    # Optional fixed setup token (e.g. for automated installs). When empty, a random
    # token is generated and written to the log at startup while setup is required.
    token: ${BUGGYWUGGY_SETUP_TOKEN:}
  security:
    login-throttle:
      max-failures: 5
      window: 15m
    # Two-factor login (TOTP, authenticator app) for all users. Users without it set up go
    # through a setup wizard at their next login; sessions without it end when it is switched on.
    two-factor:
      enabled: ${BUGGYWUGGY_TWO_FACTOR:false}
      # The name authenticator apps show with the code.
      issuer: ${BUGGYWUGGY_TWO_FACTOR_ISSUER:BuggyWuggy}

# The API documentation is intentionally public: it describes an open source API.
springdoc:
  api-docs:
    enabled: true
    path: /api/openapi
  swagger-ui:
    enabled: true
    path: /api/docs
    csrf:
      enabled: true  # Swagger UI sends the XSRF-TOKEN cookie as header, so "Try it out" works

management:
  endpoints:
    web:
      exposure:
        include: health,info
