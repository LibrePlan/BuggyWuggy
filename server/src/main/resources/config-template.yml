## BuggyWuggy configuration file
##
## Every setting is commented out and shows its default value. To change a setting, remove
## the single "#" in front of it and in front of each line above it that it belongs to (the
## parent keys, e.g. "buggywuggy:" and "  mail:"), keep the indentation, and restart
## BuggyWuggy. Lines starting with "##" are explanations.
##
## Each setting can also be given as an environment variable (shown in brackets). Set each
## setting in one place only: either here or as an environment variable.
##
## The file can contain passwords: make it readable only for the BuggyWuggy service, e.g.
##   chmod 640 application.yml && chown root:buggywuggy application.yml
## Full description: docs/installation.md, section "Configuration".

## --- Database ---------------------------------------------------------------------------
#spring:
#  datasource:
##   JDBC URL of the PostgreSQL database [BUGGYWUGGY_DB_URL]
#    url: jdbc:postgresql://localhost:5432/buggywuggy
##   Database user [BUGGYWUGGY_DB_USER]
#    username: buggywuggy
##   Database password; always change it in production [BUGGYWUGGY_DB_PASSWORD]
#    password: buggywuggy
#
## --- Attachments ------------------------------------------------------------------------
#  servlet:
#    multipart:
##     Largest file that can be attached, e.g. 10MB or 1GB [BUGGYWUGGY_MAX_ATTACHMENT_SIZE]
#      max-file-size: 50MB
##     Largest total size of the files in one upload [BUGGYWUGGY_MAX_UPLOAD_SIZE]
#      max-request-size: 200MB
#
## --- Web server -------------------------------------------------------------------------
#server:
##  HTTP port [BUGGYWUGGY_PORT]
#  port: 8080
##  Trust the X-Forwarded-* headers of a reverse proxy. Use "framework" only when BuggyWuggy
##  can be reached through the proxy alone [SERVER_FORWARD_HEADERS_STRATEGY]
#  forward-headers-strategy: none
#  servlet:
#    session:
##     How long an idle login stays valid, e.g. 30m, 8h, 7d [BUGGYWUGGY_SESSION_TIMEOUT]
#      timeout: 8h
#      cookie:
##       Send the session cookie over HTTPS only; set to true behind HTTPS [BUGGYWUGGY_SECURE_COOKIES]
#        secure: false
#
## --- BuggyWuggy -------------------------------------------------------------------------
#buggywuggy:
##  Directory for attachment files; use an absolute path in production, e.g.
##  /var/lib/buggywuggy. Back it up together with the database [BUGGYWUGGY_DATA_DIR]
#  data-dir: data
##  The address users open BuggyWuggy at; links in e-mails point here [BUGGYWUGGY_BASE_URL]
#  base-url: http://localhost:8080
##  Where users get the source code (AGPL section 13), shown under Help → About. Point it at
##  your own repository when you run a modified BuggyWuggy [BUGGYWUGGY_SOURCE_URL]
#  source-url: https://github.com/libreplan/buggywuggy
#
#  setup:
##   Fixed token for first-time setup; empty means a random token, written to the log
##   [BUGGYWUGGY_SETUP_TOKEN]
#    token: ""
#
#  donation:
#    comic:
##     Download the xkcd comic of the login page's donation text once from imgs.xkcd.com into
##     data-dir/cache/xkcd; false: never contact xkcd.com (only its attribution is shown)
##     [BUGGYWUGGY_DONATION_COMIC_DOWNLOAD]
#      download: true
#
#  security:
#    login-throttle:
##     Failed logins for one username from one address before logins are refused...
#      max-failures: 5
##     ...for this long
#      window: 15m
#    two-factor:
##     Every user logs in with a code from an authenticator app (TOTP) besides the password.
##     Users without it set up get a setup wizard at their next login; logins from before it
##     was switched on end. The secrets are encrypted with data-dir/secrets/two-factor.key
##     [BUGGYWUGGY_TWO_FACTOR]
#      enabled: false
##     The name authenticator apps show with the code [BUGGYWUGGY_TWO_FACTOR_ISSUER]
#      issuer: BuggyWuggy
#    sso:
##     Single sign-on with OpenID Connect (Keycloak, Microsoft Entra ID, Authentik, Google, ...).
##     Full description and examples per provider: docs/single-sign-on.md.
##     Who may still log in with a password: all, system-admins (emergency access when the
##     identity provider is down) or none [BUGGYWUGGY_SSO_PASSWORD_LOGIN]
#      password-login: all
##     The identity providers; each gets a "Log in with ..." button. The id ("keycloak" here)
##     is part of the redirect URI to register at the provider:
##     <base-url>/login/oauth2/code/keycloak. Every setting can also be an environment
##     variable, e.g. BUGGYWUGGY_SECURITY_SSO_PROVIDERS_KEYCLOAK_CLIENT_SECRET
#      providers:
#        keycloak:
##         Text of the login button: "Log in with ..."
#          display-name: Keycloak
##         The issuer; BuggyWuggy reads <issuer-uri>/.well-known/openid-configuration
#          issuer-uri: https://sso.example.org/realms/example
#          client-id: buggywuggy
##         Empty for a public client
#          client-secret: ""
#          scopes: [openid, profile, email]
##         The claim that becomes the username of a new account
#          username-claim: preferred_username
##         Create an account at the first login of someone without one; false: an
##         administrator creates every account first (high-security installations)
#          create-users: false
##         How a first login finds an existing account: email (only when the provider says
##         the address is verified), username or none
#          link-users-by: email
##         The claim with the user's groups; empty: groups are not synchronised
#          groups-claim: ""
##         At every login, membership of these BuggyWuggy groups follows the provider's groups
#          group-mapping:
#            - idp-group: buggywuggy-admins
#              group: administrators
##         Logging out of BuggyWuggy also logs out at the provider
#          logout-at-provider: true
#
## --- E-mail -----------------------------------------------------------------------------
#  mail:
##   SMTP server; empty means no mail is sent [BUGGYWUGGY_MAIL_HOST]
#    host: ""
##   SMTP port: usually 587 with starttls, 465 with ssl, 25 for a local relay [BUGGYWUGGY_MAIL_PORT]
#    port: 587
##   starttls, ssl or none [BUGGYWUGGY_MAIL_SECURITY]
#    security: starttls
##   SMTP login; empty means no login [BUGGYWUGGY_MAIL_USERNAME]
#    username: ""
##   SMTP password [BUGGYWUGGY_MAIL_PASSWORD]
#    password: ""
##   Sender of the mails [BUGGYWUGGY_MAIL_FROM]
#    from: "BuggyWuggy <buggywuggy@localhost>"
##   Changes by one person to one issue are combined into one mail once nothing happened
##   for quiet-period, but a mail is never held back longer than max-delay
#    quiet-period: 60s
#    max-delay: 5m
##   Attempts before a mail counts as failed; the wait doubles after each attempt
#    max-attempts: 8
##   How long sent and failed mails are kept
#    retention: 30d
##   Time-out for connecting to and talking with the mail server
#    timeout: 30s
##   How often waiting mails and notifications are processed
#    poll-interval: 10s
##   When old mails are removed (cron: second minute hour day month weekday)
#    cleanup-cron: "0 17 3 * * *"
#
## --- TaskWarrior urgency --------------------------------------------------------------
##  The urgency shown in the issue list and on the issue page, as TaskWarrior calculates it:
##  the sum of factor × coefficient for each term. See docs/taskwarrior.md for what each term
##  means in BuggyWuggy, and https://taskwarrior.org/docs/urgency/ for TaskWarrior's own.
##  Every coefficient can also be set as an environment variable, e.g.
##  BUGGYWUGGY_TASKWARRIOR_URGENCY_DUE_COEFFICIENT=10.0
#  taskwarrior:
#    urgency:
##     urgency.due.coefficient: issues that are overdue or due soon
#      due-coefficient: 12.0
##     urgency.blocking.coefficient: issues that block an unresolved issue
#      blocking-coefficient: 8.0
##     urgency.scheduled.coefficient: issues with the label "scheduled"
#      scheduled-coefficient: 5.0
##     urgency.active.coefficient: issues whose status is in progress
#      active-coefficient: 4.0
##     urgency.age.coefficient: older issues
#      age-coefficient: 2.0
##     urgency.age.max: the age in days at which the age term is at its maximum (1.0)
#      age-max: 365
##     urgency.annotations.coefficient: issues with comments
#      annotations-coefficient: 1.0
##     urgency.tags.coefficient: issues with labels
#      tags-coefficient: 1.0
##     urgency.project.coefficient: issues with a component
#      project-coefficient: 1.0
##     urgency.waiting.coefficient: issues with the label "waiting"
#      waiting-coefficient: -3.0
##     urgency.blocked.coefficient: issues blocked by an unresolved issue
#      blocked-coefficient: -5.0
##     urgency.uda.priority.<priority>.coefficient, by priority name; priorities not
##     listed count 0
#      priority:
#        Highest: 8.0
#        High: 6.0
#        Medium: 3.9
#        Low: 1.8
#        Lowest: 0.9
##     urgency.user.tag.<label>.coefficient, by label
#      tags:
#        next: 15.0
##     urgency.user.project.<key>.coefficient, by project key, e.g. {SHOP: 5.0, OPS: 2.0}
#      projects: {}
#
## --- Logging ----------------------------------------------------------------------------
#logging:
#  file:
##   Also write the log to this file; by default the log only goes to standard output
#    name: ""
#  level:
##   More detail for BuggyWuggy itself: ERROR, WARN, INFO or DEBUG
#    org.buggywuggy: INFO
