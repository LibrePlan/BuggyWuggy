# BuggyWuggy server messages (English, default).
# All user-facing text lives in these bundles; add messages_<locale>.properties for translations.
app.name=BuggyWuggy

# Generic errors
error.validation=The request contains invalid values.
error.not-found=The requested resource does not exist.
error.conflict=The resource was changed by someone else. Reload and try again.
error.forbidden=You do not have permission to perform this action.
error.unauthenticated=You need to log in to access this resource.
error.internal=An unexpected error occurred.

# Authentication
auth.bad-credentials=Invalid username or password.
auth.throttled=Too many failed login attempts. Try again later.
auth.wrong-current-password=The current password is incorrect.

# Setup
setup.already-completed=Setup has already been completed.
setup.invalid-token=The setup token is invalid.

# Users
user.not-found=User {0} does not exist.
user.username-taken=The username ''{0}'' is already in use.
user.email-taken=The e-mail address ''{0}'' is already in use.
user.cannot-deactivate-self=You cannot deactivate your own account.
user.cannot-revoke-own-admin=You cannot remove your own system administrator rights.
user.last-system-admin=At least one active system administrator must remain.
user.system-admin-required=Only system administrators can grant or revoke system administrator rights or manage other system administrators.

# Groups
group.not-found=Group {0} does not exist.
group.name-taken=The group name ''{0}'' is already in use.
group.protected=The built-in group ''{0}'' cannot be renamed or deleted.

# Bean Validation
validation.username.pattern=Use 2-100 characters: letters, digits and . _ @ + -
validation.password.size=The password must be between {min} and {max} characters.
validation.locale.pattern=Use a language tag such as 'en' or 'nl-NL'.
validation.time-zone.invalid=Unknown time zone.

# Projects
project.not-found=Project {0} does not exist.
project.key-taken=The project key ''{0}'' is already in use.
project.name-taken=The project name ''{0}'' is already in use.
project.archived=Project {0} is archived and cannot be changed.
project.lead-invalid=The project lead must be an active user.
project.global-admin-required=Only administrators can change a project key, archive or delete a project.
project.create-permission-required=You do not have permission to create projects.

# Components
component.not-found=Component {0} does not exist in this project.
component.name-taken=The component name ''{0}'' is already in use in this project.
component.lead-invalid=The component lead must be an active user.
component.lead-required=A component lead is required when issues are assigned to the component lead.

# Versions
version.not-found=Version {0} does not exist in this project.
version.name-taken=The version name ''{0}'' is already in use in this project.
version.dates-invalid=The release date cannot be before the start date.
version.order-mismatch=The list must contain every version of the project exactly once.

# Project roles
project-role.not-found=Project role {0} does not exist.
project-role.user-invalid=Only active users can be added to a project role.

validation.project-key.pattern=Use 2-10 characters: a letter followed by letters, digits or underscores.

# Issues
issue.not-found=Issue {0} does not exist.
issue.type-invalid=Unknown issue type {0}.
issue.subtask-requires-parent=Sub-tasks can only be created for a parent issue.
issue.type-change-workflow=The issue type cannot be changed to {0}, because its workflow does not contain the current status.
issue.priority-invalid=Unknown priority {0}.
issue.component-invalid=Component {0} does not belong to this project.
issue.version-invalid=Version {0} does not belong to this project.
issue.assignee-not-assignable=This user cannot be assigned issues in this project.
issue.reporter-invalid=The reporter must be an active user.
issue.reporter-permission=Only project administrators can set someone else as reporter.

validation.label.pattern=Labels cannot contain spaces and can be at most 255 characters.

# Issue hierarchy (epics and sub-tasks)
issue.parent-not-found=Parent issue {0} does not exist.
issue.parent-other-project=The parent issue must be in the same project.
issue.parent-invalid=An issue of type {0} cannot have an issue of type {1} as parent.
issue.parent-not-allowed=Issues of type {0} cannot have a parent.
issue.type-change-has-children=The issue type cannot be changed to {0} while the issue has child issues.

# Workflow transitions
issue.transition-invalid=This transition is not available for the issue in its current status.
issue.resolution-invalid=Unknown resolution {0}.
issue.resolution-not-allowed=A resolution can only be set when moving to a done status.
issue.resolution-required=A resolution is required for this transition.
